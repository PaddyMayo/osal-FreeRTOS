# Coverage gate for the freertos port, read by gcovr from the repo root.
# Run by the freertos-coverage-gate pre-commit hook, after the
# freertos-coverage-* hooks before it have built and run the tests.
#
# Only freertos/src/ and the BSP files with tests (bsp_start.c) are measured:
# the coverage test executables also instrument the tests themselves, stubs,
# adaptors, ut_assert and inlined OSAL headers, none of which are the code
# under test. Add a BSP file here when it gets a test (bsp_console.c has none yet).

root = .
filter = freertos/src/
filter = generic-freertos/src/bsp_start\.c
fail-under-line = 100
fail-under-branch = 100
print-summary = yes

# Coverage gate for the freertos port, read by gcovr from the repo root.
# Run through scripts/coverage.sh (also the freertos-coverage pre-commit
# hook) rather than calling gcovr directly.
#
# Only freertos/src/ is measured: the coverage test executables also
# instrument the tests themselves, stubs, adaptors, ut_assert and inlined
# OSAL headers, none of which are the code under test.

root = .
filter = freertos/src/
fail-under-line = 100
fail-under-branch = 100
print-summary = yes

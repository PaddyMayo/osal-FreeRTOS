repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h)$

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --inline-suppr
        language: system
        files: \.(c|h)$

      # The builds and tests run the Makefile's targets (make help), so a hook and
      # a person run the same commands.

      # The white-box tests, then gcovr fails below the thresholds in gcovr.cfg
      # (100% lines and branches).
      - id: freertos-coverage
        name: freertos coverage - white-box tests, 100% lines/branches
        entry: make
        args: [test, coverage]
        language: system
        pass_filenames: false
        verbose: true
        files: ^(freertos/|freertos-coverage-tests/|gcovr\.cfg$|platforms/|Makefile$)

      # Build the osal library for each platform, so the ARM-only code (e.g. the
      # halt path in bsp_console.c) is always built. Each platform gets its own
      # build/<platform>/ directory. The tests only run on posix, so the others
      # build without them.
      - id: freertos-cross-cortex-m0
        name: freertos cross build - cortex-m0
        entry: make
        args: [build, cortex-m0]
        language: system
        pass_filenames: false
        files: &freertos_build_files ^(freertos/|generic-freertos/|platforms/|CMakeLists\.txt$|Makefile$)
      - id: freertos-cross-cortex-m3
        name: freertos cross build - cortex-m3
        entry: make
        args: [build, cortex-m3]
        language: system
        pass_filenames: false
        files: *freertos_build_files
      - id: freertos-cross-cortex-m4f
        name: freertos cross build - cortex-m4f
        entry: make
        args: [build, cortex-m4f]
        language: system
        pass_filenames: false
        files: *freertos_build_files
      - id: freertos-cross-cortex-m7
        name: freertos cross build - cortex-m7
        entry: make
        args: [build, cortex-m7]
        language: system
        pass_filenames: false
        files: *freertos_build_files
      - id: freertos-cross-cortex-m33
        name: freertos cross build - cortex-m33
        entry: make
        args: [build, cortex-m33]
        language: system
        pass_filenames: false
        files: *freertos_build_files

      # The same port cross compiled for another CPU, and the host build with the
      # unit tests on, so every platform has a build here.
      - id: freertos-cross-posix-aarch64
        name: freertos cross build - posix-aarch64
        entry: make
        args: [build, posix-aarch64]
        language: system
        pass_filenames: false
        files: *freertos_build_files
      - id: freertos-build-posix
        name: freertos build - posix
        entry: make
        args: [build, posix]
        language: system
        pass_filenames: false
        files: *freertos_build_files

      # MISRA C:2012 on the port's own code, on the posix build's defines and include
      # paths. It configures build/posix first, because the include paths include the
      # headers that configure generates, so it does not depend on another hook having
      # run. Any violation fails. misra-config is suppressed: it only says a name could
      # not be resolved, and what is left unresolved is the console's vendor macros
      # (bsp_console.c), which no one build defines. The rules are still checked on
      # everything it did parse.
      - id: freertos-misra
        name: freertos misra
        entry: bash -c 'cmake -S . -B build/posix -C platforms/posix/config.cmake > /dev/null && exec cppcheck "$@"' bash
        args:
          - --addon=misra
          - --enable=style
          - --error-exitcode=1
          - --quiet
          - --inline-suppr
          - --suppressions-list=misra-suppressions.txt
          - --suppress=missingIncludeSystem
          - --suppress=misra-config
          - -D__GNUC__
          - -DLFS_NO_MALLOC
          - -DOSAL_FREERTOS_MINIMAL_STACK_SIZE=PTHREAD_STACK_MIN
          - -DOSAL_FREERTOS_PORT_CLEAN_UP_TCB=vPortCancelThread
          - -DOSAL_FREERTOS_PORT_ENDS_SCHEDULER=1
          - -DOSAL_FREERTOS_PORT_HEADER="pthread.h"
          - -DOSAL_FREERTOS_PORT_POSIX=1
          - -DOSAL_FREERTOS_TICK_RATE_HZ=100
          - -DOSAL_FREERTOS_TOTAL_HEAP_SIZE=16777216
          - -Ithird_party/osal/src/os/inc
          - -Ibuild/posix/osal_build/inc
          - -Ifreertos/inc
          - -Igeneric-freertos/src
          - -Igeneric-freertos/config
          - -Ithird_party/osal/src/os/shared/inc
          - -Ithird_party/osal/src/bsp/shared/inc
          - -Ithird_party/FreeRTOS-Kernel/include
          - -Ithird_party/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix
          - -Ithird_party/FreeRTOS-Kernel/portable/ThirdParty/GCC/Posix/utils
          - -Ithird_party/littlefs
          - freertos
          - generic-freertos
        language: system
        pass_filenames: false
        files: *freertos_build_files

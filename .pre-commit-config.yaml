repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h)$

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --inline-suppr
        language: system
        files: \.(c|h)$

      # The builds and tests run the Makefile's targets (make help), so a hook and
      # a person run the same commands.

      # The white-box tests, then gcovr fails below the thresholds in gcovr.cfg
      # (100% lines and branches).
      - id: freertos-coverage
        name: freertos coverage - white-box tests, 100% lines/branches
        entry: make
        args: [test, coverage]
        language: system
        pass_filenames: false
        verbose: true
        files: ^(freertos/|freertos-coverage-tests/|gcovr\.cfg$|platforms/|Makefile$)

      # Build the osal library for each platform, so the ARM-only code (e.g. the
      # halt path in bsp_console.c) is always built. Each platform gets its own
      # build/<platform>/ directory. The tests only run on posix-aarch32 (under
      # qemu), so the others build without them.
      - id: freertos-cross-cortex-m3
        name: freertos cross build - cortex-m3
        entry: make
        args: [build, cortex-m3]
        language: system
        pass_filenames: false
        files: &freertos_build_files ^(freertos/|generic-freertos/|platforms/|CMakeLists\.txt$|Makefile$)
      - id: freertos-cross-cortex-m4f
        name: freertos cross build - cortex-m4f
        entry: make
        args: [build, cortex-m4f]
        language: system
        pass_filenames: false
        files: *freertos_build_files
      - id: freertos-cross-cortex-m7
        name: freertos cross build - cortex-m7
        entry: make
        args: [build, cortex-m7]
        language: system
        pass_filenames: false
        files: *freertos_build_files
      - id: freertos-cross-cortex-m33
        name: freertos cross build - cortex-m33
        entry: make
        args: [build, cortex-m33]
        language: system
        pass_filenames: false
        files: *freertos_build_files

      # The POSIX port for 32-bit Arm Linux, with the unit tests on: the one platform
      # the tests run on.
      - id: freertos-cross-posix-aarch32
        name: freertos cross build - posix-aarch32
        entry: make
        args: [build, posix-aarch32]
        language: system
        pass_filenames: false
        files: *freertos_build_files

      # MISRA C:2012 on the port's own code (freertos/, generic-freertos/, platforms/),
      # once per platform, so each is checked as it builds: the defines and include
      # paths come from the platform's own build (make misra). Any violation fails;
      # misra-suppressions.txt lists the rules the port breaks today.
      - id: freertos-misra-posix-aarch32
        name: freertos misra - posix-aarch32
        entry: make
        args: [misra, posix-aarch32]
        language: system
        pass_filenames: false
        files: &freertos_misra_files ^(freertos/|generic-freertos/|platforms/|CMakeLists\.txt$|Makefile$|misra-suppressions\.txt$)
      - id: freertos-misra-cortex-m3
        name: freertos misra - cortex-m3
        entry: make
        args: [misra, cortex-m3]
        language: system
        pass_filenames: false
        files: *freertos_misra_files
      - id: freertos-misra-cortex-m4f
        name: freertos misra - cortex-m4f
        entry: make
        args: [misra, cortex-m4f]
        language: system
        pass_filenames: false
        files: *freertos_misra_files
      - id: freertos-misra-cortex-m7
        name: freertos misra - cortex-m7
        entry: make
        args: [misra, cortex-m7]
        language: system
        pass_filenames: false
        files: *freertos_misra_files
      - id: freertos-misra-cortex-m33
        name: freertos misra - cortex-m33
        entry: make
        args: [misra, cortex-m33]
        language: system
        pass_filenames: false
        files: *freertos_misra_files

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h)$

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --inline-suppr
        language: system
        files: \.(c|h)$

      # ======================================================================
      # Port checks (freertos-*)
      #
      # Every hook below calls the Makefile (see `make help`), so a person at a
      # terminal and the hook / CI run exactly the same commands. There are
      # three kinds of check:
      #
      #   1. coverage  - runs the white-box tests and enforces 100% coverage.
      #                  Runs ONCE, over every platform.
      #   2. cross build - compiles the osal library for each platform, so code
      #                  that only builds for one architecture (e.g. the halt
      #                  path in bsp_console.c) cannot break unnoticed. Build
      #                  only: no tests run in these hooks.
      #   3. misra     - MISRA C:2012 static analysis, once per platform.
      #
      # The platforms are the ones in the Makefile's PLATFORMS list:
      #   posix-aarch32  32-bit Arm Linux, the POSIX port, run under qemu-user
      #   cortex-m3      ARMv7-M
      #   cortex-m4f     ARMv7E-M, single-precision hardware FPU (fpv4-sp-d16)
      #   cortex-m7      ARMv7E-M, double-precision hardware FPU (fpv5-d16)
      #   cortex-m33     ARMv8-M mainline
      # Each Cortex-M image boots on its own QEMU board; posix-aarch32 is the
      # default platform for a bare `make test`.
      # ======================================================================

      # ---- 1. Coverage -----------------------------------------------------
      # Runs the white-box tests (freertos-coverage-tests/) on EVERY platform,
      # each on its own QEMU process, then gcovr fails the commit if lines or
      # branches fall below the thresholds in gcovr.cfg (100% for both).
      # Why: the port is checked against real kernels for each architecture,
      # not just the host, and no code path is left untested.
      # Runs when the port, its tests, or the test tooling change.
      - id: freertos-coverage
        name: freertos coverage - white-box tests, 100% lines/branches
        entry: make
        args: [test, coverage, all]
        language: system
        pass_filenames: false
        verbose: true
        files: ^(freertos/|freertos-coverage-tests/|scripts/|gcovr\.cfg$|platforms/|Makefile$)

      # ---- 2. Cross builds -------------------------------------------------
      # Builds the osal library for one platform. Each platform gets its own
      # build/<platform>/ directory, so the builds never overwrite each other.
      # The Cortex-M hooks only prove the library compiles and links for that
      # core; the tests for them run in the coverage hook above.
      # All of them re-run when the port, the BSP, a platform config, or the
      # root build files change (the shared pattern below).

      # Cortex-M builds
      - id: freertos-cross-cortex-m3
        name: freertos cross build - cortex-m3
        entry: make
        args: [build, cortex-m3]
        language: system
        pass_filenames: false
        files: &freertos_build_files ^(freertos/|generic-freertos/|platforms/|CMakeLists\.txt$|Makefile$)
      - id: freertos-cross-cortex-m4f
        name: freertos cross build - cortex-m4f
        entry: make
        args: [build, cortex-m4f]
        language: system
        pass_filenames: false
        files: *freertos_build_files
      - id: freertos-cross-cortex-m7
        name: freertos cross build - cortex-m7
        entry: make
        args: [build, cortex-m7]
        language: system
        pass_filenames: false
        files: *freertos_build_files
      - id: freertos-cross-cortex-m33
        name: freertos cross build - cortex-m33
        entry: make
        args: [build, cortex-m33]
        language: system
        pass_filenames: false
        files: *freertos_build_files

      # POSIX build (32-bit Arm Linux). Unlike the Cortex-M builds it also
      # builds with OSAL's unit tests on, so the black-box tests are compiled
      # for the platform that runs them under qemu-user.
      - id: freertos-cross-posix-aarch32
        name: freertos cross build - posix-aarch32
        entry: make
        args: [build, posix-aarch32]
        language: system
        pass_filenames: false
        files: *freertos_build_files

      # ---- 3. MISRA C:2012 -------------------------------------------------
      # Static analysis of the port's own code only (freertos/, generic-freertos/,
      # platforms/), not FreeRTOS or OSAL. Run once per platform because the
      # defines and include paths come from that platform's own build
      # (make misra), so code behind a platform's #ifdefs is checked as it is
      # really compiled. Any violation fails the hook; the rules the port
      # knowingly breaks today are listed in misra-suppressions.txt.
      # Also re-runs when misra-suppressions.txt changes.

      # POSIX
      - id: freertos-misra-posix-aarch32
        name: freertos misra - posix-aarch32
        entry: make
        args: [misra, posix-aarch32]
        language: system
        pass_filenames: false
        files: &freertos_misra_files ^(freertos/|generic-freertos/|platforms/|CMakeLists\.txt$|Makefile$|misra-suppressions\.txt$)

      # Cortex-M
      - id: freertos-misra-cortex-m3
        name: freertos misra - cortex-m3
        entry: make
        args: [misra, cortex-m3]
        language: system
        pass_filenames: false
        files: *freertos_misra_files
      - id: freertos-misra-cortex-m4f
        name: freertos misra - cortex-m4f
        entry: make
        args: [misra, cortex-m4f]
        language: system
        pass_filenames: false
        files: *freertos_misra_files
      - id: freertos-misra-cortex-m7
        name: freertos misra - cortex-m7
        entry: make
        args: [misra, cortex-m7]
        language: system
        pass_filenames: false
        files: *freertos_misra_files
      - id: freertos-misra-cortex-m33
        name: freertos misra - cortex-m33
        entry: make
        args: [misra, cortex-m33]
        language: system
        pass_filenames: false
        files: *freertos_misra_files

name: sim-test
on: [push, pull_request]

# Runs the firmware on every platform under QEMU (freertos-sim-tests/). It is a
# workflow of its own, so the product build in ci.yml does not depend on it.
jobs:
  sim-test:
    runs-on: ubuntu-latest
    container: ghcr.io/paddymayo/osal-freertos-dev:latest
    strategy:
      fail-fast: false
      matrix:
        platform: [cortex-m0, cortex-m3, cortex-m4f, cortex-m7, cortex-m33, posix-aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S freertos-sim-tests -B build/sim-${{ matrix.platform }} -C platforms/${{ matrix.platform }}/config.cmake
      - run: cmake --build build/sim-${{ matrix.platform }} -j
      - run: ctest --test-dir build/sim-${{ matrix.platform }} --output-on-failure
      # The firmware that failed, for reproducing the run locally with gdb
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firmware-${{ matrix.platform }}
          path: build/sim-${{ matrix.platform }}/sim_smoke

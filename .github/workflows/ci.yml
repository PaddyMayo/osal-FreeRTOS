name: build-and-test
on:
  push:
    branches: [main]
  pull_request:

# One job: pre-commit is the single definition of every check, so CI runs what
# `pre-commit run --all-files` runs locally. That is the formatting and static
# checks, the white-box tests with the coverage gate, a build of every platform
# and MISRA (.pre-commit-config.yaml).
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: ghcr.io/paddymayo/osal-freertos-dev:latest
    steps:
      # Submodules are needed by the freertos-coverage hooks, which configure
      # and build the coverage tests against third_party/osal.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pre-commit run --all-files

name: build-and-test
on:
  push:
    branches: [main]
  pull_request:

# pre-commit is the single definition of every check, and its hooks run the
# Makefile's targets, so CI runs what `pre-commit run --all-files` runs locally.
# Each leg of the matrix runs some of the hooks in .pre-commit-config.yaml, so a
# platform or a check that fails shows up as its own job. A hook that is not named
# in a leg does not run in CI, so name a new hook here.
jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ghcr.io/paddymayo/osal-freertos-dev:latest
    # The hooks run make build and make test, which hide the tools' progress. A CI log
    # has nobody to scroll it, so it keeps everything, as make build.verbose does.
    env:
      VERBOSE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            hooks: clang-format cppcheck
          - name: coverage
            hooks: freertos-coverage
          - name: posix-aarch32
            hooks: freertos-cross-posix-aarch32 freertos-misra-posix-aarch32
          - name: cortex-m3
            hooks: freertos-cross-cortex-m3 freertos-misra-cortex-m3
          - name: cortex-m4f
            hooks: freertos-cross-cortex-m4f freertos-misra-cortex-m4f
          - name: cortex-m7
            hooks: freertos-cross-cortex-m7 freertos-misra-cortex-m7
          - name: cortex-m33
            hooks: freertos-cross-cortex-m33 freertos-misra-cortex-m33
    steps:
      # Submodules are needed by the builds and the coverage tests, which compile
      # third_party/osal and the FreeRTOS kernel.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          for hook in ${{ matrix.hooks }}; do
            pre-commit run "$hook" --all-files || exit 1
          done

  # The one check the ruleset requires, so it does not list every leg above. It
  # runs even when a leg failed, and fails then.
  build-and-test:
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.checks.result }}" = success

name: build-and-test
on: [push, pull_request]

jobs:
  pre-check:
    runs-on: ubuntu-latest
    container: ghcr.io/paddymayo/osal-freertos-dev:latest
    steps:
      # Submodules are needed by the freertos-coverage hook, which configures
      # and builds the coverage tests against third_party/osal.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pre-commit run --all-files

  build-and-test:
    runs-on: ubuntu-latest
    container: ghcr.io/paddymayo/osal-freertos-dev:latest
    needs: pre-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build
      - run: cmake --build build --target osal -j

  post-check:
    runs-on: ubuntu-latest
    container: ghcr.io/paddymayo/osal-freertos-dev:latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cppcheck --addon=misra freertos generic-freertos